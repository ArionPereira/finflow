<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#00e5a0"/>
  <title>FinFlow</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--border:#252530;
      --text:#f0f0f5;--text2:#7070888;--text2:#707080;
      --green:#00e5a0;--red:#ff4d6d;--blue:#4d9fff;--yellow:#ffd166;--purple:#b57bee;
      --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
      --nav-h:64px;--header-h:56px;
    }
    html,body{height:100%;overflow:hidden}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overscroll-behavior:none}
    #root{height:100%;display:flex;flex-direction:column}
    h1,h2,h3{font-family:'Syne',sans-serif}
    /* Scrollable content area */
    .page-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 16px + var(--safe-bottom))}
    ::-webkit-scrollbar{display:none}
    /* Header */
    .top-header{height:var(--header-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:var(--safe-top);flex-shrink:0;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(10,10,15,0.92)}
    .header-title{font-size:18px;font-weight:700;letter-spacing:-0.3px}
    .header-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    /* Bottom Nav */
    .bottom-nav{height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:rgba(17,17,24,0.95);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;backdrop-filter:blur(16px);position:fixed;bottom:0;left:0;right:0;z-index:50}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text2);cursor:pointer;font-size:10px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;transition:color 0.15s;padding:8px 0}
    .nav-btn.active{color:var(--green)}
    .nav-btn .ni{font-size:20px;transition:transform 0.15s}
    .nav-btn.active .ni{transform:scale(1.15)}
    /* Cards */
    .px{padding:0 16px}
    .summary-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
    .summary-card-wide{grid-column:1/-1}
    .scard{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px}
    .scard-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2);margin-bottom:6px;font-weight:600}
    .scard-value{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;line-height:1}
    .scard-value.green{color:var(--green)}
    .scard-value.red{color:var(--red)}
    .scard-value.blue{color:var(--blue)}
    /* List items */
    .list-section{margin-bottom:20px}
    .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2);font-weight:600;padding:0 16px;margin-bottom:8px}
    .list-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin:0 16px;overflow:hidden}
    .list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(37,37,48,0.6)}
    .list-item:last-child{border-bottom:none}
    .item-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .item-info{flex:1;min-width:0}
    .item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-sub{font-size:11px;color:var(--text2);margin-top:1px}
    .item-amount{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;white-space:nowrap}
    /* FAB */
    .fab{position:fixed;bottom:calc(var(--nav-h) + 16px + var(--safe-bottom));right:20px;width:54px;height:54px;background:var(--green);border-radius:50%;border:none;color:#000;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(0,229,160,0.4);z-index:40;transition:transform 0.15s,box-shadow 0.15s}
    .fab:active{transform:scale(0.93);box-shadow:0 2px 12px rgba(0,229,160,0.3)}
    /* Sheet (bottom modal) */
    .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(4px)}
    .sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + var(--safe-bottom));width:100%;max-height:92vh;overflow-y:auto;border-top:1px solid var(--border)}
    .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
    .sheet-title{font-size:18px;font-weight:700;margin-bottom:20px}
    /* Form */
    .form-group{margin-bottom:14px}
    .form-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);font-weight:600;margin-bottom:6px;display:block}
    .form-input{width:100%;background:var(--bg3);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none}
    .form-input:focus{border-color:var(--green)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    /* Type toggle */
    .type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .type-btn{padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);font-size:14px;font-weight:600;text-align:center;cursor:pointer;transition:all 0.15s}
    .type-btn.active.r{background:rgba(0,229,160,0.12);border-color:var(--green);color:var(--green)}
    .type-btn.active.d{background:rgba(255,77,109,0.12);border-color:var(--red);color:var(--red)}
    /* Buttons */
    .btn-full{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;transition:opacity 0.15s}
    .btn-full:active{opacity:0.8}
    .btn-green{background:var(--green);color:#000}
    .btn-ghost{background:var(--bg3);color:var(--text);border:1.5px solid var(--border);margin-top:8px}
    .btn-danger{background:rgba(255,77,109,0.15);color:var(--red);border:1.5px solid rgba(255,77,109,0.3)}
    /* Badge */
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
    .badge.r{background:rgba(0,229,160,0.12);color:var(--green)}
    .badge.d{background:rgba(255,77,109,0.12);color:var(--red)}
    /* Month nav */
    .month-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
    .month-nav-btn{width:36px;height:36px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .month-nav-label{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
    /* Goal card */
    .goal-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 16px 10px}
    .goal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .goal-emoji{font-size:26px}
    .goal-name{font-size:15px;font-weight:600;flex:1}
    .goal-pct{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
    .progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:8px}
    .progress-fill{height:100%;border-radius:3px;transition:width 0.5s}
    .goal-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
    /* Icon picker */
    .icon-picker{display:flex;flex-wrap:wrap;gap:6px}
    .icon-opt{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg3);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
    .icon-opt.sel{border-color:var(--green);background:rgba(0,229,160,0.12)}
    /* Chart */
    .chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 16px 16px}
    .chart-title{font-size:13px;font-weight:600;margin-bottom:12px}
    /* Cat item */
    .cat-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(37,37,48,0.6)}
    .cat-row:last-child{border-bottom:none}
    .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    /* empty */
    .empty{text-align:center;padding:48px 24px;color:var(--text2)}
    .empty-icon{font-size:40px;margin-bottom:10px}
    /* Chip */
    .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px}
    /* Toast */
    .toast{position:fixed;top:calc(var(--header-h) + 12px);left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;z-index:200;white-space:nowrap;animation:toastIn 0.2s ease}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    /* Swipe delete hint */
    .swipe-hint{display:flex;align-items:center;gap:8px}
    .action-btns{display:flex;gap:6px;flex-shrink:0}
    .icon-btn{width:32px;height:32px;border-radius:8px;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--bg3)}
    .icon-btn.edit{color:var(--blue)}
    .icon-btn.del{color:var(--red);background:rgba(255,77,109,0.1)}
    /* Install banner */
    .install-banner{background:linear-gradient(135deg,rgba(0,229,160,0.15),rgba(77,159,255,0.1));border:1px solid rgba(0,229,160,0.25);border-radius:14px;padding:14px;margin:12px 16px;display:flex;align-items:center;gap:12px}
    .install-banner-text{flex:1;font-size:13px}
    .install-banner-text strong{display:block;font-size:14px;margin-bottom:2px}
    .install-btn{background:var(--green);color:#000;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:'DM Sans',sans-serif}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// Auto-detect API URL
const API = window.location.origin.includes('localhost') ? 'http://localhost:5000' : window.location.origin;

const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtDate = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '';
const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const monthShort = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function useApi(url, deps=[]) {
  const [data, setData] = useState(null);
  const reload = useCallback(() => {
    fetch(url).then(r=>r.json()).then(setData).catch(()=>{});
  }, [url]);
  useEffect(()=>{ reload(); }, [reload, ...deps]);
  return { data, reload };
}

function Toast({ msg, onClose }) {
  useEffect(()=>{ const t=setTimeout(onClose,2500); return ()=>clearTimeout(t); },[]);
  return <div className="toast">{msg}</div>;
}

// ===== TRANSACTION SHEET =====
function TxSheet({ onClose, onSave, initial, categories }) {
  const [form, setForm] = useState(initial||{description:'',amount:'',type:'despesa',category_id:'',date:new Date().toISOString().slice(0,10),notes:''});
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const catsByType = (categories||[]).filter(c=>c.type===form.type);

  const submit = async(e) => {
    e.preventDefault();
    const method = initial?.id ? 'PUT' : 'POST';
    const url = initial?.id ? `${API}/api/transactions/${initial.id}` : `${API}/api/transactions`;
    await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});
    onSave();
  };

  return (
    <div className="sheet-overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-title">{initial?.id?'Editar':'Nova'} Transação</div>
        <form onSubmit={submit}>
          <div className="type-row">
            <button type="button" className={`type-btn ${form.type==='receita'?'active r':''}`} onClick={()=>{set('type','receita');set('category_id','');}}>💰 Receita</button>
            <button type="button" className={`type-btn ${form.type==='despesa'?'active d':''}`} onClick={()=>{set('type','despesa');set('category_id','');}}>💸 Despesa</button>
          </div>
          <div className="form-group">
            <label className="form-label">Descrição</label>
            <input className="form-input" required value={form.description} onChange={e=>set('description',e.target.value)} placeholder="Ex: Mercado, Salário..."/>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Valor (R$)</label>
              <input className="form-input" required type="number" step="0.01" min="0.01" inputMode="decimal" value={form.amount} onChange={e=>set('amount',e.target.value)} placeholder="0,00"/>
            </div>
            <div className="form-group">
              <label className="form-label">Data</label>
              <input className="form-input" required type="date" value={form.date} onChange={e=>set('date',e.target.value)}/>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Categoria</label>
            <select className="form-input" value={form.category_id} onChange={e=>set('category_id',e.target.value)}>
              <option value="">Sem categoria</option>
              {catsByType.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Observações (opcional)</label>
            <input className="form-input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Detalhes..."/>
          </div>
          <button type="submit" className="btn-full btn-green">Salvar</button>
          <button type="button" className="btn-full btn-ghost" onClick={onClose}>Cancelar</button>
        </form>
      </div>
    </div>
  );
}

// ===== GOAL SHEET =====
function GoalSheet({ onClose, onSave, initial }) {
  const icons = ['🎯','🏠','🚗','✈️','📱','🎓','💍','🌴','💰','🏋️','🎸','💻'];
  const [form, setForm] = useState(initial||{name:'',target_amount:'',current_amount:'0',deadline:'',color:'#10b981',icon:'🎯'});
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const submit = async(e) => {
    e.preventDefault();
    const method = initial?.id ? 'PUT' : 'POST';
    const url = initial?.id ? `${API}/api/goals/${initial.id}` : `${API}/api/goals`;
    await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});
    onSave();
  };

  return (
    <div className="sheet-overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-title">{initial?.id?'Editar':'Nova'} Meta</div>
        <form onSubmit={submit}>
          <div className="form-group">
            <label className="form-label">Ícone</label>
            <div className="icon-picker">
              {icons.map(ic=><button type="button" key={ic} className={`icon-opt ${form.icon===ic?'sel':''}`} onClick={()=>set('icon',ic)}>{ic}</button>)}
            </div>
          </div>
          <div className="form-group" style={{marginTop:10}}>
            <label className="form-label">Nome</label>
            <input className="form-input" required value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ex: Viagem para Europa"/>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Valor alvo</label>
              <input className="form-input" required type="number" step="0.01" inputMode="decimal" value={form.target_amount} onChange={e=>set('target_amount',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">Já guardado</label>
              <input className="form-input" type="number" step="0.01" inputMode="decimal" value={form.current_amount} onChange={e=>set('current_amount',e.target.value)}/>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Prazo</label>
              <input className="form-input" type="date" value={form.deadline||''} onChange={e=>set('deadline',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">Cor</label>
              <input className="form-input" type="color" value={form.color} onChange={e=>set('color',e.target.value)} style={{height:46,cursor:'pointer'}}/>
            </div>
          </div>
          <button type="submit" className="btn-full btn-green">Salvar</button>
          <button type="button" className="btn-full btn-ghost" onClick={onClose}>Cancelar</button>
        </form>
      </div>
    </div>
  );
}

// ===== CAT SHEET =====
function CatSheet({ onClose, onSave }) {
  const icons2 = ['💰','💼','🏠','🚗','🍔','❤️','🎮','📚','👕','📦','✈️','💻','📈','🎓','🛒'];
  const [form, setForm] = useState({name:'',type:'despesa',color:'#6366f1',icon:'💰'});
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const submit = async(e) => {
    e.preventDefault();
    await fetch(`${API}/api/categories`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});
    onSave();
  };

  return (
    <div className="sheet-overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-title">Nova Categoria</div>
        <form onSubmit={submit}>
          <div className="type-row">
            <button type="button" className={`type-btn ${form.type==='receita'?'active r':''}`} onClick={()=>set('type','receita')}>💰 Receita</button>
            <button type="button" className={`type-btn ${form.type==='despesa'?'active d':''}`} onClick={()=>set('type','despesa')}>💸 Despesa</button>
          </div>
          <div className="form-group">
            <label className="form-label">Ícone</label>
            <div className="icon-picker">
              {icons2.map(ic=><button type="button" key={ic} className={`icon-opt ${form.icon===ic?'sel':''}`} onClick={()=>set('icon',ic)}>{ic}</button>)}
            </div>
          </div>
          <div className="form-row" style={{marginTop:10}}>
            <div className="form-group">
              <label className="form-label">Nome</label>
              <input className="form-input" required value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ex: Academia"/>
            </div>
            <div className="form-group">
              <label className="form-label">Cor</label>
              <input className="form-input" type="color" value={form.color} onChange={e=>set('color',e.target.value)} style={{height:46,cursor:'pointer'}}/>
            </div>
          </div>
          <button type="submit" className="btn-full btn-green">Criar</button>
          <button type="button" className="btn-full btn-ghost" onClick={onClose}>Cancelar</button>
        </form>
      </div>
    </div>
  );
}

// ===== DASHBOARD PAGE =====
function Dashboard({ month, categories }) {
  const { data: summary, reload } = useApi(`${API}/api/summary?month=${month}`, [month]);

  if (!summary) return <div style={{textAlign:'center',padding:40,color:'var(--text2)'}}>Carregando...</div>;

  const formatLabel = m => { if(!m)return''; const[,mo]=m.split('-'); return monthShort[parseInt(mo)-1]; };

  const pieData = (summary.despesas_por_categoria||[]).map(d=>({name:d.name,value:parseFloat((d.total).toFixed(2)),color:d.color,icon:d.icon}));

  return (
    <div>
      <div className="summary-cards">
        <div className="scard summary-card-wide" style={{background:'linear-gradient(135deg,rgba(0,229,160,0.08),rgba(77,159,255,0.06))',borderColor:'rgba(0,229,160,0.2)'}}>
          <div className="scard-label">Saldo do mês</div>
          <div className={`scard-value ${summary.saldo>=0?'green':'red'}`} style={{fontSize:32}}>{fmt(summary.saldo)}</div>
          <div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>{summary.saldo>=0?'✓ No positivo':'⚠ Atenção: saldo negativo'}</div>
        </div>
        <div className="scard">
          <div className="scard-label">Receitas</div>
          <div className="scard-value green">{fmt(summary.receitas)}</div>
        </div>
        <div className="scard">
          <div className="scard-label">Despesas</div>
          <div className="scard-value red">{fmt(summary.despesas)}</div>
        </div>
      </div>

      {summary.trend?.length > 0 && (
        <div className="chart-wrap">
          <div className="chart-title">Últimos meses</div>
          <Recharts.ResponsiveContainer width="100%" height={160}>
            <Recharts.BarChart data={summary.trend} barGap={3} barCategoryGap="30%">
              <Recharts.CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)" vertical={false}/>
              <Recharts.XAxis dataKey="month" tickFormatter={formatLabel} tick={{fill:'#707080',fontSize:10}} axisLine={false} tickLine={false}/>
              <Recharts.YAxis hide/>
              <Recharts.Tooltip formatter={v=>fmt(v)} labelFormatter={formatLabel} contentStyle={{background:'#18181f',border:'1px solid #252530',borderRadius:8,fontSize:12}}/>
              <Recharts.Bar dataKey="receitas" name="Receitas" fill="#00e5a0" radius={[4,4,0,0]}/>
              <Recharts.Bar dataKey="despesas" name="Despesas" fill="#ff4d6d" radius={[4,4,0,0]}/>
            </Recharts.BarChart>
          </Recharts.ResponsiveContainer>
        </div>
      )}

      {pieData.length > 0 && (
        <div className="list-section">
          <div className="section-title">Top categorias de despesa</div>
          <div className="list-card">
            {pieData.map((d,i)=>(
              <div className="list-item" key={i}>
                <div className="item-icon" style={{background:`${d.color}22`}}>{d.icon}</div>
                <div className="item-info"><div className="item-name">{d.name}</div></div>
                <div className="item-amount" style={{color:d.color}}>{fmt(d.value)}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {pieData.length===0 && summary.receitas===0 && summary.despesas===0 && (
        <div className="empty"><div className="empty-icon">💡</div><div style={{fontSize:14}}>Comece lançando uma transação!</div></div>
      )}
    </div>
  );
}

// ===== TRANSACTIONS PAGE =====
function Transactions({ month, categories }) {
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const [typeFilter, setTypeFilter] = useState('all');
  const { data: txs, reload } = useApi(`${API}/api/transactions?month=${month}`, [month]);

  const filtered = (txs||[]).filter(t => typeFilter==='all' || t.type===typeFilter);

  const del = async(id) => {
    await fetch(`${API}/api/transactions/${id}`,{method:'DELETE'});
    reload(); setToast('Removido');
  };

  return (
    <div>
      {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
      {sheet && <TxSheet categories={categories} initial={sheet===true?null:sheet} onClose={()=>setSheet(null)} onSave={()=>{reload();setSheet(null);setToast('Salvo!');}}/>}

      <div style={{display:'flex',gap:8,padding:'8px 16px 12px'}}>
        {[['all','Todos'],['receita','Receitas'],['despesa','Despesas']].map(([v,l])=>(
          <button key={v} onClick={()=>setTypeFilter(v)}
            style={{padding:'6px 14px',borderRadius:20,border:'1.5px solid',fontSize:12,fontWeight:600,cursor:'pointer',
              borderColor:typeFilter===v?'var(--green)':'var(--border)',
              background:typeFilter===v?'rgba(0,229,160,0.12)':'var(--bg2)',
              color:typeFilter===v?'var(--green)':'var(--text2)'}}>
            {l}
          </button>
        ))}
      </div>

      {filtered.length===0
        ? <div className="empty"><div className="empty-icon">📭</div><div style={{fontSize:14}}>Sem transações</div></div>
        : <div className="list-card" style={{margin:'0 16px'}}>
            {filtered.map(t=>(
              <div className="list-item" key={t.id}>
                <div className="item-icon" style={{background:t.category_color?`${t.category_color}22`:'var(--bg3)'}}>
                  {t.category_icon||( t.type==='receita'?'💰':'💸')}
                </div>
                <div className="item-info">
                  <div className="item-name">{t.description}</div>
                  <div className="item-sub">{fmtDate(t.date)} {t.category_name&&`· ${t.category_name}`}</div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
                  <div className="item-amount" style={{color:t.type==='receita'?'var(--green)':'var(--red)'}}>
                    {t.type==='receita'?'+':'-'}{fmt(t.amount)}
                  </div>
                  <div className="action-btns">
                    <button className="icon-btn edit" onClick={()=>setSheet(t)}>✏️</button>
                    <button className="icon-btn del" onClick={()=>del(t.id)}>🗑</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
      }

      <button className="fab" onClick={()=>setSheet(true)}>+</button>
    </div>
  );
}

// ===== GOALS PAGE =====
function Goals() {
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const { data: goals, reload } = useApi(`${API}/api/goals`);

  const del = async(id) => {
    await fetch(`${API}/api/goals/${id}`,{method:'DELETE'});
    reload(); setToast('Removida');
  };

  return (
    <div>
      {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
      {sheet && <GoalSheet initial={sheet===true?null:sheet} onClose={()=>setSheet(null)} onSave={()=>{reload();setSheet(null);setToast('Meta salva!');}}/>}

      <div style={{padding:'12px 16px 8px',display:'flex',justifyContent:'flex-end'}}>
        <button onClick={()=>setSheet(true)} style={{background:'var(--green)',color:'#000',border:'none',borderRadius:10,padding:'10px 18px',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>+ Nova meta</button>
      </div>

      {!goals?.length
        ? <div className="empty"><div className="empty-icon">🎯</div><div style={{fontSize:14}}>Nenhuma meta ainda. Crie a sua!</div></div>
        : goals.map(g=>{
            const pct = Math.min(100,(g.current_amount/g.target_amount)*100);
            return (
              <div className="goal-card" key={g.id}>
                <div className="goal-header">
                  <span className="goal-emoji">{g.icon}</span>
                  <div style={{flex:1}}>
                    <div className="goal-name">{g.name}</div>
                    {g.deadline&&<div style={{fontSize:11,color:'var(--text2)'}}>📅 {fmtDate(g.deadline)}</div>}
                  </div>
                  <span className="goal-pct" style={{color:g.color}}>{pct.toFixed(0)}%</span>
                </div>
                <div className="progress-bar"><div className="progress-fill" style={{width:`${pct}%`,background:g.color}}/></div>
                <div className="goal-row">
                  <span><strong style={{color:'var(--text)'}}>{fmt(g.current_amount)}</strong> guardado</span>
                  <span style={{color:pct>=100?'var(--green)':undefined}}>{pct>=100?'✓ Concluída!':`Faltam ${fmt(g.target_amount-g.current_amount)}`}</span>
                </div>
                <div style={{display:'flex',gap:8,marginTop:12}}>
                  <button className="btn-full btn-ghost" style={{margin:0,padding:'8px',fontSize:13}} onClick={()=>setSheet(g)}>✏️ Editar</button>
                  <button className="btn-full btn-danger" style={{margin:0,padding:'8px',fontSize:13}} onClick={()=>del(g.id)}>🗑 Excluir</button>
                </div>
              </div>
            );
          })
      }
    </div>
  );
}

// ===== SETTINGS PAGE =====
function Settings() {
  const [sheet, setSheet] = useState(false);
  const [toast, setToast] = useState(null);
  const { data: categories, reload } = useApi(`${API}/api/categories`);

  const del = async(id) => {
    await fetch(`${API}/api/categories/${id}`,{method:'DELETE'});
    reload(); setToast('Removida');
  };

  const receitas = (categories||[]).filter(c=>c.type==='receita');
  const despesas = (categories||[]).filter(c=>c.type==='despesa');

  return (
    <div>
      {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
      {sheet && <CatSheet onClose={()=>setSheet(false)} onSave={()=>{reload();setSheet(false);setToast('Criada!');}}/>}

      <div style={{padding:'12px 16px 8px',display:'flex',justifyContent:'flex-end'}}>
        <button onClick={()=>setSheet(true)} style={{background:'var(--green)',color:'#000',border:'none',borderRadius:10,padding:'10px 18px',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>+ Nova categoria</button>
      </div>

      {[['💰 Receitas', receitas], ['💸 Despesas', despesas]].map(([title, cats])=>(
        <div className="list-section" key={title}>
          <div className="section-title">{title}</div>
          {cats.length===0
            ? <div style={{padding:'12px 16px',color:'var(--text2)',fontSize:13}}>Nenhuma</div>
            : <div className="list-card">
                {cats.map(c=>(
                  <div className="cat-row" key={c.id}>
                    <span style={{fontSize:20}}>{c.icon}</span>
                    <span className="cat-dot" style={{background:c.color}}/>
                    <span style={{flex:1,fontSize:14}}>{c.name}</span>
                    <button className="icon-btn del" onClick={()=>del(c.id)}>✕</button>
                  </div>
                ))}
              </div>
          }
        </div>
      ))}

      <div style={{padding:'0 16px 16px'}}>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:14,padding:16,fontSize:13,color:'var(--text2)'}}>
          <div style={{fontWeight:600,color:'var(--text)',marginBottom:4}}>FinFlow v1.0</div>
          <div>Controle financeiro pessoal</div>
          <div style={{marginTop:8,fontSize:12}}>Para instalar: toque nos 3 pontos do Chrome → "Adicionar à tela inicial"</div>
        </div>
      </div>
    </div>
  );
}

// ===== ROOT APP =====
function App() {
  const [page, setPage] = useState('dashboard');
  const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
  const [installPrompt, setInstallPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(false);
  const { data: categories, reload: reloadCats } = useApi(`${API}/api/categories`);

  useEffect(()=>{
    // Register service worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    }
    // Capture install prompt
    const handler = e => { e.preventDefault(); setInstallPrompt(e); setShowInstall(true); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  },[]);

  const handleInstall = () => {
    if(installPrompt){ installPrompt.prompt(); installPrompt.userChoice.then(()=>{setShowInstall(false);}); }
  };

  const prevMonth = () => setMonth(m=>{ const d=new Date(m+'-01'); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); });
  const nextMonth = () => setMonth(m=>{ const d=new Date(m+'-01'); d.setMonth(d.getMonth()+1); return d.toISOString().slice(0,7); });

  const [y, mo] = month.split('-');
  const showMonthNav = ['dashboard','transactions'].includes(page);

  const pages = {
    dashboard: <Dashboard month={month} categories={categories}/>,
    transactions: <Transactions month={month} categories={categories}/>,
    goals: <Goals/>,
    settings: <Settings/>,
  };

  const nav = [
    {id:'dashboard',icon:'📊',label:'Início'},
    {id:'transactions',icon:'💳',label:'Lançar'},
    {id:'goals',icon:'🎯',label:'Metas'},
    {id:'settings',icon:'⚙️',label:'Config'},
  ];

  return (
    <>
      {/* Header */}
      <div className="top-header">
        <span className="header-logo">FinFlow</span>
        {showMonthNav && (
          <div className="month-nav" style={{padding:0}}>
            <button className="month-nav-btn" onClick={prevMonth}>‹</button>
            <span className="month-nav-label" style={{padding:'0 8px',fontSize:13}}>{monthShort[parseInt(mo)-1]} {y}</span>
            <button className="month-nav-btn" onClick={nextMonth}>›</button>
          </div>
        )}
        {!showMonthNav && <div style={{fontSize:14,fontWeight:600,color:'var(--text2)'}}>{page==='goals'?'Metas':page==='settings'?'Configurações':''}</div>}
      </div>

      {/* Scrollable content */}
      <div className="page-scroll">
        {showInstall && (
          <div className="install-banner">
            <span style={{fontSize:24}}>📲</span>
            <div className="install-banner-text">
              <strong>Instalar FinFlow</strong>
              Adicione à tela inicial do seu celular
            </div>
            <button className="install-btn" onClick={handleInstall}>Instalar</button>
            <button onClick={()=>setShowInstall(false)} style={{background:'none',border:'none',color:'var(--text2)',cursor:'pointer',padding:'0 4px',fontSize:18}}>✕</button>
          </div>
        )}
        {pages[page]}
      </div>

      {/* Bottom nav */}
      <nav className="bottom-nav">
        {nav.map(n=>(
          <button key={n.id} className={`nav-btn ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
            <span className="ni">{n.icon}</span>
            <span>{n.label}</span>
          </button>
        ))}
      </nav>
    </>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
