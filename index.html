<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#00e5a0"/>
  <title>FinFlow</title>
  <link rel="manifest" href="/manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--border:#252530;
      --text:#f0f0f5;--muted:#707080;
      --green:#00e5a0;--red:#ff4d6d;--blue:#4d9fff;
      --nav-h:64px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
    }
    html,body,#root{height:100%;overflow:hidden}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
    #root{display:flex;flex-direction:column}
    h1,h2,h3{font-family:'Syne',sans-serif}
    ::-webkit-scrollbar{display:none}

    .header{height:52px;padding-top:var(--safe-t);background:rgba(10,10,15,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px;flex-shrink:0;backdrop-filter:blur(12px)}
    .logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .month-nav{display:flex;align-items:center;gap:8px}
    .month-btn{width:32px;height:32px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .month-label{font-size:13px;font-weight:600;min-width:90px;text-align:center}

    .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 16px + var(--safe-b))}

    .bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(17,17,24,0.97);border-top:1px solid var(--border);display:flex;backdrop-filter:blur(16px);z-index:50}
    .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;cursor:pointer;padding:8px 0}
    .navbtn.on{color:var(--green)}
    .navbtn .ic{font-size:20px}

    .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
    .card-wide{grid-column:1/-1}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px}
    .card-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px;font-weight:600}
    .card-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}
    .card-val.g{color:var(--green)}.card-val.r{color:var(--red)}.card-val.b{color:var(--blue)}
    .card-sub{font-size:11px;color:var(--muted);margin-top:3px}

    .section{margin-bottom:16px}
    .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;padding:0 16px;margin-bottom:8px}
    .listcard{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin:0 16px;overflow:hidden}
    .listitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(37,37,48,0.5)}
    .listitem:last-child{border-bottom:none}
    .licon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--bg3)}
    .linfo{flex:1;min-width:0}
    .lname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lsub{font-size:11px;color:var(--muted);margin-top:1px}
    .lamount{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;white-space:nowrap;flex-shrink:0}
    .lactions{display:flex;gap:6px;flex-shrink:0}
    .ibtn{width:30px;height:30px;border-radius:8px;border:none;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--bg3)}

    .fab{position:fixed;bottom:calc(var(--nav-h)+16px+var(--safe-b));right:18px;width:52px;height:52px;background:var(--green);border-radius:50%;border:none;color:#000;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,229,160,0.4);z-index:40}
    .fab:active{transform:scale(0.92)}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(4px)}
    .sheet{background:var(--bg2);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + var(--safe-b));width:100%;max-height:92vh;overflow-y:auto;border-top:1px solid var(--border)}
    .handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
    .stitle{font-size:18px;font-weight:700;margin-bottom:18px}

    .fg{margin-bottom:13px}
    label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:5px}
    input,select,textarea{width:100%;background:var(--bg3);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none}
    input:focus,select:focus{border-color:var(--green)}
    select option{background:var(--bg3)}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    .ttoggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .tbtn{padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg3);color:var(--muted);font-size:14px;font-weight:600;text-align:center;cursor:pointer}
    .tbtn.on.r{background:rgba(0,229,160,0.12);border-color:var(--green);color:var(--green)}
    .tbtn.on.d{background:rgba(255,77,109,0.12);border-color:var(--red);color:var(--red)}

    .btnfull{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px}
    .btnfull:active{opacity:0.8}
    .btn-g{background:var(--green);color:#000}
    .btn-ghost{background:var(--bg3);color:var(--text);border:1.5px solid var(--border);margin-top:8px}
    .btn-del{background:rgba(255,77,109,0.12);color:var(--red);border:1.5px solid rgba(255,77,109,0.25)}

    .badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
    .badge.r{background:rgba(0,229,160,0.12);color:var(--green)}
    .badge.d{background:rgba(255,77,109,0.12);color:var(--red)}

    .filters{display:flex;gap:8px;padding:8px 16px 12px;flex-wrap:wrap}
    .chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
    .chip.on{border-color:var(--green);background:rgba(0,229,160,0.1);color:var(--green)}

    .goal-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 16px 10px}
    .goal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .goal-emoji{font-size:26px}
    .goal-name{flex:1;font-size:15px;font-weight:600}
    .goal-pct{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
    .pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:8px}
    .pfill{height:100%;border-radius:3px}
    .goal-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

    .icons{display:flex;flex-wrap:wrap;gap:6px}
    .iopt{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg3);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .iopt.on{border-color:var(--green);background:rgba(0,229,160,0.12)}

    .empty{text-align:center;padding:48px 24px;color:var(--muted)}
    .empty-icon{font-size:40px;margin-bottom:10px}

    .toast{position:fixed;top:calc(52px + 10px + var(--safe-t));left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;z-index:200;white-space:nowrap}

    .cat-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(37,37,48,0.5)}
    .cat-row:last-child{border-bottom:none}
    .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:5000' : '';

const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtD = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '';
const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function Toast({msg,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2500);return()=>clearTimeout(t);},[]);
  return <div className="toast">{msg}</div>;
}

// ---- TRANSACTION SHEET ----
function TxSheet({onClose,onSave,initial,categories}){
  const today = new Date().toISOString().slice(0,10);
  const [f,setF] = useState(initial||{description:'',amount:'',type:'despesa',category_id:'',date:today,notes:''});
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const cats = (categories||[]).filter(c=>c.type===f.type);

  const submit = async e => {
    e.preventDefault();
    const method = f.id ? 'PUT':'POST';
    const url = f.id ? `${API}/api/transactions/${f.id}` : `${API}/api/transactions`;
    const res = await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});
    if(res.ok) onSave(); else alert('Erro ao salvar');
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="handle"/>
        <div className="stitle">{f.id?'Editar':'Nova'} Transação</div>
        <form onSubmit={submit}>
          <div className="ttoggle">
            <button type="button" className={`tbtn ${f.type==='receita'?'on r':''}`} onClick={()=>{s('type','receita');s('category_id','');}}>💰 Receita</button>
            <button type="button" className={`tbtn ${f.type==='despesa'?'on d':''}`} onClick={()=>{s('type','despesa');s('category_id','');}}>💸 Despesa</button>
          </div>
          <div className="fg"><label>Descrição</label><input required value={f.description} onChange={e=>s('description',e.target.value)} placeholder="Ex: Mercado, Salário..."/></div>
          <div className="frow">
            <div className="fg"><label>Valor (R$)</label><input required type="number" step="0.01" min="0.01" inputMode="decimal" value={f.amount} onChange={e=>s('amount',e.target.value)}/></div>
            <div className="fg"><label>Data</label><input required type="date" value={f.date} onChange={e=>s('date',e.target.value)}/></div>
          </div>
          <div className="fg"><label>Categoria</label>
            <select value={f.category_id} onChange={e=>s('category_id',e.target.value)}>
              <option value="">Sem categoria</option>
              {cats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
            </select>
          </div>
          <div className="fg"><label>Observação (opcional)</label><input value={f.notes} onChange={e=>s('notes',e.target.value)}/></div>
          <button type="submit" className="btnfull btn-g">Salvar</button>
          <button type="button" className="btnfull btn-ghost" onClick={onClose}>Cancelar</button>
        </form>
      </div>
    </div>
  );
}

// ---- GOAL SHEET ----
function GoalSheet({onClose,onSave,initial}){
  const ICONS=['🎯','🏠','🚗','✈️','📱','🎓','💍','🌴','💰','🏋️'];
  const [f,setF]=useState(initial||{name:'',target_amount:'',current_amount:'0',deadline:'',color:'#10b981',icon:'🎯'});
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=async e=>{
    e.preventDefault();
    const method=f.id?'PUT':'POST';
    const url=f.id?`${API}/api/goals/${f.id}`:`${API}/api/goals`;
    await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});
    onSave();
  };
  return(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="handle"/>
        <div className="stitle">{f.id?'Editar':'Nova'} Meta</div>
        <form onSubmit={submit}>
          <div className="fg"><label>Ícone</label><div className="icons">{ICONS.map(ic=><button type="button" key={ic} className={`iopt ${f.icon===ic?'on':''}`} onClick={()=>s('icon',ic)}>{ic}</button>)}</div></div>
          <div className="fg" style={{marginTop:10}}><label>Nome</label><input required value={f.name} onChange={e=>s('name',e.target.value)} placeholder="Ex: Viagem"/></div>
          <div className="frow">
            <div className="fg"><label>Valor alvo</label><input required type="number" step="0.01" inputMode="decimal" value={f.target_amount} onChange={e=>s('target_amount',e.target.value)}/></div>
            <div className="fg"><label>Já guardado</label><input type="number" step="0.01" inputMode="decimal" value={f.current_amount} onChange={e=>s('current_amount',e.target.value)}/></div>
          </div>
          <div className="frow">
            <div className="fg"><label>Prazo</label><input type="date" value={f.deadline||''} onChange={e=>s('deadline',e.target.value)}/></div>
            <div className="fg"><label>Cor</label><input type="color" value={f.color} onChange={e=>s('color',e.target.value)} style={{height:46,cursor:'pointer'}}/></div>
          </div>
          <button type="submit" className="btnfull btn-g">Salvar</button>
          <button type="button" className="btnfull btn-ghost" onClick={onClose}>Cancelar</button>
        </form>
      </div>
    </div>
  );
}

// ---- CAT SHEET ----
function CatSheet({onClose,onSave}){
  const ICONS=['💰','💼','🏠','🚗','🍔','❤️','🎮','📚','👕','📦','✈️','💻','📈','🎓','🛒'];
  const [f,setF]=useState({name:'',type:'despesa',color:'#6366f1',icon:'💰'});
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=async e=>{
    e.preventDefault();
    await fetch(`${API}/api/categories`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});
    onSave();
  };
  return(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="handle"/>
        <div className="stitle">Nova Categoria</div>
        <form onSubmit={submit}>
          <div className="ttoggle">
            <button type="button" className={`tbtn ${f.type==='receita'?'on r':''}`} onClick={()=>s('type','receita')}>💰 Receita</button>
            <button type="button" className={`tbtn ${f.type==='despesa'?'on d':''}`} onClick={()=>s('type','despesa')}>💸 Despesa</button>
          </div>
          <div className="fg"><label>Ícone</label><div className="icons">{ICONS.map(ic=><button type="button" key={ic} className={`iopt ${f.icon===ic?'on':''}`} onClick={()=>s('icon',ic)}>{ic}</button>)}</div></div>
          <div className="frow" style={{marginTop:10}}>
            <div className="fg"><label>Nome</label><input required value={f.name} onChange={e=>s('name',e.target.value)} placeholder="Ex: Academia"/></div>
            <div className="fg"><label>Cor</label><input type="color" value={f.color} onChange={e=>s('color',e.target.value)} style={{height:46,cursor:'pointer'}}/></div>
          </div>
          <button type="submit" className="btnfull btn-g">Criar</button>
          <button type="button" className="btnfull btn-ghost" onClick={onClose}>Cancelar</button>
        </form>
      </div>
    </div>
  );
}

// ---- PAGES ----
function PageDashboard({month}){
  const [data,setData]=useState(null);
  useEffect(()=>{
    setData(null);
    fetch(`${API}/api/summary?month=${month}`)
      .then(r=>r.json())
      .then(d=>setData(d))
      .catch(()=>setData({receitas:0,despesas:0,saldo:0,despesas_por_categoria:[]}));
  },[month]);

  if(!data) return <div style={{padding:40,textAlign:'center',color:'var(--muted)'}}>Carregando...</div>;

  const cats = data.despesas_por_categoria||[];
  return(
    <div>
      <div className="cards">
        <div className="card card-wide" style={{background:'linear-gradient(135deg,rgba(0,229,160,0.08),rgba(77,159,255,0.06))',borderColor:'rgba(0,229,160,0.2)'}}>
          <div className="card-label">Saldo do mês</div>
          <div className={`card-val ${data.saldo>=0?'g':'r'}`} style={{fontSize:30}}>{fmt(data.saldo)}</div>
          <div className="card-sub">{data.saldo>=0?'✓ Positivo':'⚠ Negativo'}</div>
        </div>
        <div className="card">
          <div className="card-label">Receitas</div>
          <div className="card-val g">{fmt(data.receitas)}</div>
        </div>
        <div className="card">
          <div className="card-label">Despesas</div>
          <div className="card-val r">{fmt(data.despesas)}</div>
        </div>
      </div>

      {cats.length>0 && (
        <div className="section">
          <div className="sec-title">Top despesas por categoria</div>
          <div className="listcard">
            {cats.map((d,i)=>(
              <div className="listitem" key={i}>
                <div className="licon" style={{background:`${d.color}22`}}>{d.icon}</div>
                <div className="linfo"><div className="lname">{d.name}</div></div>
                <div className="lamount" style={{color:d.color}}>{fmt(d.total)}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {cats.length===0 && data.receitas===0 && (
        <div className="empty"><div className="empty-icon">💡</div><div style={{fontSize:14}}>Comece lançando uma transação!</div></div>
      )}
    </div>
  );
}

function PageTransactions({month,categories}){
  const [txs,setTxs]=useState([]);
  const [sheet,setSheet]=useState(null);
  const [toast,setToast]=useState(null);
  const [tf,setTf]=useState('all');

  const load=useCallback(()=>{
    fetch(`${API}/api/transactions?month=${month}`)
      .then(r=>r.json()).then(setTxs).catch(()=>{});
  },[month]);

  useEffect(()=>{ load(); },[load]);

  const del=async id=>{
    if(!confirm('Deletar?')) return;
    await fetch(`${API}/api/transactions/${id}`,{method:'DELETE'});
    load(); setToast('Removido');
  };

  const filtered = txs.filter(t=>tf==='all'||t.type===tf);

  return(
    <div>
      {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
      {sheet && <TxSheet categories={categories} initial={sheet===true?null:sheet} onClose={()=>setSheet(null)} onSave={()=>{load();setSheet(null);setToast('Salvo!');}}/>}

      <div className="filters">
        {[['all','Todos'],['receita','Receitas'],['despesa','Despesas']].map(([v,l])=>(
          <button key={v} className={`chip ${tf===v?'on':''}`} onClick={()=>setTf(v)}>{l}</button>
        ))}
      </div>

      {filtered.length===0
        ? <div className="empty"><div className="empty-icon">📭</div><div style={{fontSize:14}}>Sem transações</div></div>
        : <div className="listcard">
            {filtered.map(t=>(
              <div className="listitem" key={t.id}>
                <div className="licon" style={{background:t.category_color?`${t.category_color}22`:'var(--bg3)'}}>
                  {t.category_icon||(t.type==='receita'?'💰':'💸')}
                </div>
                <div className="linfo">
                  <div className="lname">{t.description}</div>
                  <div className="lsub">{fmtD(t.date)}{t.category_name?` · ${t.category_name}`:''}</div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
                  <div className="lamount" style={{color:t.type==='receita'?'var(--green)':'var(--red)'}}>
                    {t.type==='receita'?'+':'-'}{fmt(t.amount)}
                  </div>
                  <div className="lactions">
                    <button className="ibtn" style={{color:'var(--blue)'}} onClick={()=>setSheet(t)}>✏️</button>
                    <button className="ibtn" style={{color:'var(--red)',background:'rgba(255,77,109,0.1)'}} onClick={()=>del(t.id)}>🗑</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
      }
      <button className="fab" onClick={()=>setSheet(true)}>+</button>
    </div>
  );
}

function PageGoals(){
  const [goals,setGoals]=useState([]);
  const [sheet,setSheet]=useState(null);
  const [toast,setToast]=useState(null);
  const load=()=>fetch(`${API}/api/goals`).then(r=>r.json()).then(setGoals).catch(()=>{});
  useEffect(()=>{load();},[]);
  const del=async id=>{
    if(!confirm('Deletar meta?')) return;
    await fetch(`${API}/api/goals/${id}`,{method:'DELETE'});
    load(); setToast('Removida');
  };
  return(
    <div>
      {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
      {sheet && <GoalSheet initial={sheet===true?null:sheet} onClose={()=>setSheet(null)} onSave={()=>{load();setSheet(null);setToast('Meta salva!');}}/>}
      <div style={{display:'flex',justifyContent:'flex-end',padding:'12px 16px 8px'}}>
        <button onClick={()=>setSheet(true)} style={{background:'var(--green)',color:'#000',border:'none',borderRadius:10,padding:'10px 18px',fontSize:14,fontWeight:700,cursor:'pointer'}}>+ Nova meta</button>
      </div>
      {goals.length===0
        ? <div className="empty"><div className="empty-icon">🎯</div><div style={{fontSize:14}}>Nenhuma meta ainda</div></div>
        : goals.map(g=>{
            const pct=Math.min(100,(g.current_amount/g.target_amount)*100)||0;
            return(
              <div className="goal-card" key={g.id}>
                <div className="goal-head">
                  <span className="goal-emoji">{g.icon}</span>
                  <div style={{flex:1}}>
                    <div className="goal-name">{g.name}</div>
                    {g.deadline&&<div style={{fontSize:11,color:'var(--muted)'}}>📅 {fmtD(g.deadline)}</div>}
                  </div>
                  <span className="goal-pct" style={{color:g.color}}>{pct.toFixed(0)}%</span>
                </div>
                <div className="pbar"><div className="pfill" style={{width:`${pct}%`,background:g.color}}/></div>
                <div className="goal-row">
                  <span><strong style={{color:'var(--text)'}}>{fmt(g.current_amount)}</strong> guardado</span>
                  <span style={{color:pct>=100?'var(--green)':undefined}}>{pct>=100?'✓ Concluída!`:`Faltam ${fmt(g.target_amount-g.current_amount)}`}</span>
                </div>
                <div style={{display:'flex',gap:8,marginTop:12}}>
                  <button className="btnfull btn-ghost" style={{margin:0,padding:'8px',fontSize:13}} onClick={()=>setSheet(g)}>✏️ Editar</button>
                  <button className="btnfull btn-del" style={{margin:0,padding:'8px',fontSize:13}} onClick={()=>del(g.id)}>🗑 Excluir</button>
                </div>
              </div>
            );
          })
      }
    </div>
  );
}

function PageSettings(){
  const [cats,setCats]=useState([]);
  const [sheet,setSheet]=useState(false);
  const [toast,setToast]=useState(null);
  const load=()=>fetch(`${API}/api/categories`).then(r=>r.json()).then(setCats).catch(()=>{});
  useEffect(()=>{load();},[]);
  const del=async id=>{
    await fetch(`${API}/api/categories/${id}`,{method:'DELETE'});
    load(); setToast('Removida');
  };
  const receitas=cats.filter(c=>c.type==='receita');
  const despesas=cats.filter(c=>c.type==='despesa');
  return(
    <div>
      {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
      {sheet && <CatSheet onClose={()=>setSheet(false)} onSave={()=>{load();setSheet(false);setToast('Criada!');}}/>}
      <div style={{display:'flex',justifyContent:'flex-end',padding:'12px 16px 8px'}}>
        <button onClick={()=>setSheet(true)} style={{background:'var(--green)',color:'#000',border:'none',borderRadius:10,padding:'10px 18px',fontSize:14,fontWeight:700,cursor:'pointer'}}>+ Nova categoria</button>
      </div>
      {[['💰 Receitas',receitas],['💸 Despesas',despesas]].map(([title,list])=>(
        <div className="section" key={title}>
          <div className="sec-title">{title}</div>
          {list.length===0
            ? <div style={{padding:'8px 16px',color:'var(--muted)',fontSize:13}}>Nenhuma</div>
            : <div className="listcard">
                {list.map(c=>(
                  <div className="cat-row" key={c.id}>
                    <span style={{fontSize:20}}>{c.icon}</span>
                    <span className="cdot" style={{background:c.color}}/>
                    <span style={{flex:1,fontSize:14}}>{c.name}</span>
                    <button className="ibtn" style={{color:'var(--red)'}} onClick={()=>del(c.id)}>✕</button>
                  </div>
                ))}
              </div>
          }
        </div>
      ))}
      <div style={{padding:'0 16px 16px'}}>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:14,padding:16,fontSize:13,color:'var(--muted)'}}>
          <div style={{fontWeight:600,color:'var(--text)',marginBottom:4}}>FinFlow v2.0</div>
          <div>Para instalar: 3 pontos do Chrome → "Adicionar à tela inicial"</div>
        </div>
      </div>
    </div>
  );
}

// ---- APP ----
function App(){
  const [page,setPage]=useState('dashboard');
  const [month,setMonth]=useState(new Date().toISOString().slice(0,7));
  const [cats,setCats]=useState([]);

  useEffect(()=>{
    fetch(`${API}/api/categories`).then(r=>r.json()).then(setCats).catch(()=>{});
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  },[]);

  const [y,mo]=month.split('-');
  const prevM=()=>setMonth(m=>{const d=new Date(m+'-01');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);});
  const nextM=()=>setMonth(m=>{const d=new Date(m+'-01');d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7);});

  const showMonth = page==='dashboard'||page==='transactions';

  const NAV=[{id:'dashboard',ic:'📊',lb:'Início'},{id:'transactions',ic:'💳',lb:'Lançar'},{id:'goals',ic:'🎯',lb:'Metas'},{id:'settings',ic:'⚙️',lb:'Config'}];

  return(
    <>
      <div className="header">
        <span className="logo">FinFlow</span>
        {showMonth && (
          <div className="month-nav">
            <button className="month-btn" onClick={prevM}>‹</button>
            <span className="month-label">{MONTHS[parseInt(mo)-1]} {y}</span>
            <button className="month-btn" onClick={nextM}>›</button>
          </div>
        )}
      </div>

      <div className="scroll">
        {page==='dashboard' && <PageDashboard month={month}/>}
        {page==='transactions' && <PageTransactions month={month} categories={cats}/>}
        {page==='goals' && <PageGoals/>}
        {page==='settings' && <PageSettings/>}
      </div>

      <nav className="bottomnav">
        {NAV.map(n=>(
          <button key={n.id} className={`navbtn ${page===n.id?'on':''}`} onClick={()=>setPage(n.id)}>
            <span className="ic">{n.ic}</span>
            <span>{n.lb}</span>
          </button>
        ))}
      </nav>
    </>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
