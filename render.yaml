services:
  - type: web
    name: finflow
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: FLASK_ENV
        value: production
    disk:
      name: finflow-db
      mountPath: /data
      sizeGB: 1
